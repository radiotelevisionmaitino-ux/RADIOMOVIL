
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAITINO | UNIDAD MÓVIL PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #030305; --panel: #121216; --accent: #00ffaa; --danger: #ff1a1a; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; overflow: hidden; }
        
        .unit-card { background: var(--panel); border: 1px solid var(--border); border-radius: 30px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .status-light { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #333; margin-right: 8px; transition: 0.3s; }
        .status-light.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .status-light.error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .status-text { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #666; font-weight: 800; }

        .vu-meter { background: #000; border-radius: 10px; padding: 10px; margin: 20px 0; border: 1px solid var(--border); }
        canvas { width: 100%; height: 60px; display: block; }
        
        .btn-link { background: var(--accent); color: #000; border: none; padding: 25px; border-radius: 20px; width: 100%; font-weight: 900; font-size: 1.2rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .btn-link.live { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 26, 26, 0.4); }
        
        .info-box { margin-top: 20px; font-size: 0.7rem; color: #444; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .audio-label { font-size: 0.6rem; color: var(--accent); margin-bottom: 5px; text-align: left; display: block; font-weight: bold;}
        
        .mic-controls { display: none; margin: 20px 0; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .mic-controls.show { display: block; }
        .btn-mic { background: var(--accent); color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-mic.muted { background: #555; color: #fff; }
    </style>
</head>
<body>

<div class="unit-card">
    <div style="margin-bottom: 20px;">
        <span id="light" class="status-light"></span>
        <span id="status" class="status-text">Sistema Listo</span>
    </div>

    <div class="vu-meter">
        <span class="audio-label">RETORNO ESTUDIO</span>
        <canvas id="vu-retorno"></canvas>
    </div>

    <!-- Reproductor nativo para evitar bloqueos de Web Audio API en móviles -->
    <audio id="retorno-audio" autoplay playsinline></audio>

    <button class="btn-link" id="main-btn" onclick="toggleConexion()">
        <i class="fas fa-satellite-dish"></i> ESTABLECER ENLACE
    </button>

    <div class="mic-controls" id="mic-panel">
        <span class="audio-label" style="color:#fff; margin-bottom: 10px;">MI MICRÓFONO</span>
        <button class="btn-mic" id="btn-mic-local" onclick="toggleMicLocal()">MIC ABIERTO</button>
    </div>

    <div class="info-box">
        <div style="margin-bottom: 5px;"><i class="fas fa-server"></i> <b>Host:</b> maitino-studio-host-v2</div>
        <div style="margin-bottom: 5px;"><i class="fas fa-bolt"></i> <b>Modo:</b> Conexión Directa (Baja Latencia)</div>
        <div><i class="fas fa-headphones"></i> <b>Auriculares:</b> Conectados obligatoriamente.</div>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let activeCall; 
    let isConnected = false;
    let isMicMuted = false;

    const TARGET_HOST = 'maitino-studio-host-v2';

    async function toggleConexion() {
        if (isConnected || peer) {
            window.location.reload();
            return;
        }

        const status = document.getElementById('status');
        const light = document.getElementById('light');
        const btn = document.getElementById('main-btn');

        status.innerText = "Abriendo micrófono...";
        light.className = "status-light";

        try {
            // 1. Captura de audio completamente cruda e inmediata
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false, 
                    sampleRate: 48000 
                }
            });

            status.innerText = "Contactando servidor...";
            
            // 2. Conexión simplificada
            peer = new Peer({
                host: 'maitino-peer-server.onrender.com',
                port: 443,
                secure: true,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:global.stun.twilio.com:3478' }
                    ]
                }
            });

            peer.on('open', (id) => {
                status.innerText = "Llamando al estudio...";
                
                // 3. Llamada directa con el stream nativo
                activeCall = peer.call(TARGET_HOST, localStream);
                
                activeCall.on('stream', (remoteStream) => {
                    isConnected = true;
                    
                    // 4. Reproducción Segura
                    const audioElem = document.getElementById('retorno-audio');
                    audioElem.srcObject = remoteStream;
                    
                    // Forzar Play
                    audioElem.play().catch(e => console.warn("Toque la pantalla para escuchar el retorno."));

                    // Actualizar UI
                    btn.innerHTML = '<i class="fas fa-times-circle"></i> CORTAR ENLACE';
                    btn.classList.add('live');
                    status.innerText = "EN EL AIRE";
                    light.className = "status-light active";
                    document.getElementById('mic-panel').classList.add('show'); 
                    
                    // 5. Iniciar Analizador Visual Pasivo
                    iniciarVisualizador(remoteStream);
                });

                activeCall.on('close', () => manejarDesconexion("Estudio desconectado"));
                activeCall.on('error', () => manejarDesconexion("Fallo en la llamada"));
            });

            peer.on('error', (err) => {
                manejarDesconexion("Error de red o Servidor apagado");
            });

            peer.on('disconnected', () => {
                peer.reconnect();
            });

        } catch (e) {
            alert("Acceso denegado al micrófono.");
            window.location.reload();
        }
    }

    function manejarDesconexion(mensaje) {
        document.getElementById('status').innerText = mensaje;
        document.getElementById('light').className = "status-light error";
        setTimeout(() => window.location.reload(), 3000);
    }

    function toggleMicLocal() {
        if (!localStream) return;
        isMicMuted = !isMicMuted;
        
        // Apagado físico del track de audio (0 latencia, 0 fallos)
        localStream.getAudioTracks()[0].enabled = !isMicMuted;
        
        const btn = document.getElementById('btn-mic-local');
        btn.innerText = isMicMuted ? "MIC CERRADO" : "MIC ABIERTO";
        btn.classList.toggle('muted', isMicMuted);
    }

    function iniciarVisualizador(stream) {
        try {
            // Se usa el AudioContext SOLO para dibujar, NUNCA para emitir sonido
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyzer = audioCtx.createAnalyser();
            analyzer.fftSize = 64;
            source.connect(analyzer); // IMPORTANTE: No se conecta a audioCtx.destination

            const canvas = document.getElementById('vu-retorno');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const data = new Uint8Array(analyzer.frequencyBinCount);

            function draw() {
                if (!isConnected) return;
                requestAnimationFrame(draw);
                analyzer.getByteFrequencyData(data);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / data.length) * 2.5;
                let x = 0;

                for(let i = 0; i < data.length; i++) {
                    const barHeight = (data[i] / 255) * canvas.height;
                    if(data[i] > 200) ctx.fillStyle = '#ff1a1a';
                    else if(data[i] > 150) ctx.fillStyle = '#ffaa00';
                    else ctx.fillStyle = '#00ffaa';
                    ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                    x += barWidth;
                }
            }
            draw();
        } catch (e) {
            console.log("Visualizador omitido por restricciones del navegador.");
        }
    }
</script>
</body>
</html>

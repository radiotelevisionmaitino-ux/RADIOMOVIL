
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAITINO | UNIDAD MÓVIL PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #030305; --panel: #121216; --accent: #00ffaa; --danger: #ff1a1a; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; overflow: hidden; }
        
        .unit-card { background: var(--panel); border: 1px solid var(--border); border-radius: 30px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .status-light { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #333; margin-right: 8px; transition: 0.3s; }
        .status-light.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .status-light.error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .status-text { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #666; font-weight: 800; }

        .vu-meter { background: #000; border-radius: 10px; padding: 10px; margin: 20px 0; border: 1px solid var(--border); }
        canvas { width: 100%; height: 60px; display: block; }
        
        .btn-link { background: var(--accent); color: #000; border: none; padding: 25px; border-radius: 20px; width: 100%; font-weight: 900; font-size: 1.2rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .btn-link.live { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255, 26, 26, 0.4); }
        
        .info-box { margin-top: 20px; font-size: 0.7rem; color: #444; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .audio-label { font-size: 0.6rem; color: var(--accent); margin-bottom: 5px; text-align: left; display: block; font-weight: bold;}
        
        .mic-controls { display: none; margin: 20px 0; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .mic-controls.show { display: block; }
        .btn-mic { background: var(--accent); color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-bottom: 15px; }
        .btn-mic.muted { background: #555; color: #fff; }

        /* Estilo faders minimalistas */
        .slider-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 0.65rem; color: #aaa; }
        input[type="range"] { -webkit-appearance: none; width: 70%; height: 4px; background: #333; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="unit-card">
    <div style="margin-bottom: 20px;">
        <span id="light" class="status-light"></span>
        <span id="status" class="status-text">Sistema Listo</span>
    </div>

    <div class="vu-meter">
        <span class="audio-label">ESPECTRO SEÑAL RETORNO</span>
        <canvas id="vu-retorno"></canvas>
    </div>
    
    <audio id="retorno-audio" autoplay playsinline></audio>

    <button class="btn-link" id="main-btn" onclick="iniciarConexion()">
        <i class="fas fa-satellite-dish"></i> ESTABLECER ENLACE
    </button>

    <div class="mic-controls" id="mic-panel">
        <button class="btn-mic" id="btn-mic-local" onclick="toggleMicLocal()">MIC ABIERTO</button>
        
        <div class="slider-group">
            <span>VOL. MIC</span>
            <input type="range" id="vol-mic" min="0" max="2" step="0.1" value="1" oninput="actualizarVolumenes()">
        </div>
        <div class="slider-group">
            <span>RETORNO</span>
            <input type="range" id="vol-retorno" min="0" max="1" step="0.05" value="0.8" oninput="actualizarVolumenes()">
        </div>
    </div>

    <div class="info-box">
        <div style="margin-bottom: 5px;"><i class="fas fa-server"></i> <b id="host-info">Host: maitino-studio-host-v2</b></div>
        <div style="margin-bottom: 5px;"><i class="fas fa-bolt"></i> <b>Modo:</b> Conexión Directa (Baja Latencia)</div>
        <div><i class="fas fa-headphones"></i> <b>Auriculares:</b> Conectados obligatoriamente.</div>
    </div>
</div>

<script>
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    const HOST_PUBLICO = 'maitino-studio-host-public-v2';

    let peer, localStream, activeCall; 
    let isConnected = false, isMicMuted = false;
    
    // Nodos de audio para procesar el micrófono antes de enviarlo
    let localAudioCtx, micSource, micGain, micDest;

    function actualizarVolumenes() {
        if (micGain) micGain.gain.value = document.getElementById('vol-mic').value;
        document.getElementById('retorno-audio').volume = document.getElementById('vol-retorno').value;
    }

    async function iniciarConexion() {
        if (isConnected || peer) { window.location.reload(); return; }
        
        const status = document.getElementById('status');
        const light = document.getElementById('light');
        status.innerText = "Abriendo micrófono...";
        light.className = "status-light";

        try {
            // Captura cruda
            const rawStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 }
            });

            // Empaquetado y control de ganancia (La solución para que el estudio te escuche)
            localAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            micSource = localAudioCtx.createMediaStreamSource(rawStream);
            micGain = localAudioCtx.createGain();
            micDest = localAudioCtx.createMediaStreamDestination();
            
            micSource.connect(micGain);
            micGain.connect(micDest);
            localStream = micDest.stream; // Este es el stream procesado que enviaremos

            actualizarVolumenes();
            conectarRed(false);

        } catch (e) {
            alert("Acceso denegado al micrófono.");
            window.location.reload();
        }
    }

    function conectarRed(usarPublico = false) {
        const status = document.getElementById('status');
        document.getElementById('host-info').innerHTML = `Host: ${usarPublico ? HOST_PUBLICO : HOST_PRIVADO}`;
        status.innerText = usarPublico ? "Conectando red pública..." : "Contactando servidor...";

        let config = { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } };
        if (!usarPublico) {
            config.host = 'maitino-peer-server.onrender.com';
            config.port = 443;
            config.secure = true;
        }

        peer = new Peer(config);

        peer.on('open', () => {
            status.innerText = "Llamando al estudio...";
            let target = usarPublico ? HOST_PUBLICO : HOST_PRIVADO;
            
            // Llamada enviando el stream procesado con volumen controlado
            activeCall = peer.call(target, localStream);
            
            activeCall.on('stream', (remoteStream) => {
                isConnected = true;
                const audioElem = document.getElementById('retorno-audio');
                audioElem.srcObject = remoteStream;
                audioElem.play().catch(e => console.warn("Toque la pantalla para escuchar el retorno."));

                document.getElementById('main-btn').innerHTML = '<i class="fas fa-times-circle"></i> CORTAR ENLACE';
                document.getElementById('main-btn').classList.add('live');
                status.innerText = "EN EL AIRE";
                document.getElementById('light').className = "status-light active";
                document.getElementById('mic-panel').classList.add('show');
                
                iniciarVisualizador(remoteStream);
            });

            activeCall.on('close', () => manejarDesconexion("Estudio desconectado"));
            activeCall.on('error', () => fallbackConexion(usarPublico));
        });

        peer.on('error', () => fallbackConexion(usarPublico));
    }

    function fallbackConexion(usarPublico) {
        if (peer) peer.destroy();
        if (!usarPublico) {
            document.getElementById('status').innerText = "Fallo Render. Red pública...";
            conectarRed(true);
        } else {
            manejarDesconexion("Sin conexión. Reintentando...");
        }
    }

    function manejarDesconexion(mensaje) {
        document.getElementById('status').innerText = mensaje;
        document.getElementById('light').className = "status-light error";
        setTimeout(() => window.location.reload(), 4000);
    }

    function toggleMicLocal() {
        if (!localStream) return;
        isMicMuted = !isMicMuted;
        
        // Muteo cortando la ganancia local a 0 para no destruir la pista
        micGain.gain.value = isMicMuted ? 0 : document.getElementById('vol-mic').value;
        
        const btn = document.getElementById('btn-mic-local');
        btn.innerText = isMicMuted ? "MIC CERRADO" : "MIC ABIERTO";
        btn.classList.toggle('muted', isMicMuted);
    }

    function iniciarVisualizador(stream) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyzer = audioCtx.createAnalyser();
            analyzer.fftSize = 256; // Mayor resolución
            source.connect(analyzer);

            const canvas = document.getElementById('vu-retorno');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const data = new Uint8Array(analyzer.frequencyBinCount);

            function draw() {
                if (!isConnected) return;
                requestAnimationFrame(draw);
                analyzer.getByteFrequencyData(data);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Líneas más finitas y juntas (estilo PRO)
                const barWidth = canvas.width / data.length; 
                let x = 0;

                for(let i = 0; i < data.length; i++) {
                    const barHeight = (data[i] / 255) * canvas.height;
                    
                    let grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                    grad.addColorStop(0, '#00ffaa');
                    grad.addColorStop(0.7, '#ffaa00');
                    grad.addColorStop(1, '#ff1a1a');
                    ctx.fillStyle = grad;
                    
                    // El "- 1" deja un hueco minúsculo entre barras
                    ctx.fillRect(x, canvas.height - barHeight, Math.max(1, barWidth - 1), barHeight);
                    x += barWidth;
                }
            }
            draw();
        } catch (e) {
            console.log("Visualizador omitido.");
        }
    }
</script>
</body>
</html>
